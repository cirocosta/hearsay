version: "2"
linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: cognitive-complexity
          arguments: [10]
          exclude:
            - "**/*_test.go"
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - golines

  settings:
    gofumpt:
      module-path: github.com/cirocosta/hearsay
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cirocosta/hearsay)
        - blank
        - dot
      no-inline-comments: false
      no-prefix-comments: false
      custom-order: false
